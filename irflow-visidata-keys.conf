# Optional Kitty shortcuts for the experimental Windows Event views.
# Include this in ~/.config/kitty/kitty.conf:
#   include irflow-visidata-keys.conf
# With NumLock on, press Alt+Shift+Numpad1 through Numpad5.
# These mappings send literal VisiData gz1..gz5 command sequences.
# They apply globally in Kitty, including when VisiData is not running.
# To test VisiData first without Kitty remaps, type gz1 through gz5.
# On keyboards that report KP_End instead of KP_1, adapt key names.
map alt+shift+KP_1 send_text all gz1
map alt+shift+KP_2 send_text all gz2
map alt+shift+KP_3 send_text all gz3
map alt+shift+KP_4 send_text all gz4
map alt+shift+KP_5 send_text all gz5
map alt+shift+KP_0 send_text all gz0
